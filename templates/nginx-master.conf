server {
    listen 80;
    listen [::]:80;
    server_name {{MAIN_DOMAIN}} {{LOCATION_DOMAIN}};

    location /.well-known/acme-challenge/ {
        root /var/www/wast;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 127.0.0.1:8443 ssl;
    server_name {{LOCATION_DOMAIN}};

    ssl_certificate /etc/letsencrypt/live/{{LOCATION_DOMAIN}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{LOCATION_DOMAIN}}/privkey.pem;

    root /var/www/wast;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 127.0.0.1:8443 ssl;
    server_name {{MAIN_DOMAIN}};

    ssl_certificate /etc/letsencrypt/live/{{MAIN_DOMAIN}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{MAIN_DOMAIN}}/privkey.pem;

    root /var/www/wast;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /sub/ {
        return 404;
    }

    location ~ ^/sub/(?<token>[a-zA-Z0-9]+)$ {
        alias /var/www/wast/sub/$token.txt;
        default_type text/plain;
        add_header Profile-Title "base64:{{PROFILE_TITLE_B64}}" always;
        add_header Profile-Update-Interval "24" always;
    }

    location /connect/ {
        proxy_pass http://127.0.0.1:{{DAEMON_PORT}};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/node/ws {
        proxy_pass http://127.0.0.1:{{DAEMON_PORT}}/api/node/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        return 404;
    }
}
