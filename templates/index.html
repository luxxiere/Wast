<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Loading...</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            position: fixed;
            inset: 0;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 320px;
            text-align: center;
            padding: 0 20px;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 4px solid #ececec;
            border-top-color: #9a9a9a;
            animation: spin 0.7s linear infinite;
        }

        p.title {
            margin: 18px 0 0;
            color: #333333;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.01em;
        }

        p.subtitle {
            margin: 8px 0 0;
            color: #7a7a7a;
            font-size: 14px;
            line-height: 1.4;
            letter-spacing: 0.01em;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="spinner"></div>
        <p class="title">Серверы сейчас перегружены</p>
        <p class="subtitle">Пожалуйста, подождите немного, мы уже работаем над этим</p>
    </div>
</body>

</html>
